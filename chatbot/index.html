<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        DV Asistente IA | DV Computadoras
    </title>


    <!-- Estilos del asistente -->

    <link rel="stylesheet" href="../css/dv-asistente.css">


</head>


<body>


<div class="asistente-container">


    <!-- CABECERA DEL CHAT -->

    <header class="asistente-header">


        <div class="avatar">

            <img 
            src="../imagenes/dv-asistente.png" 
            alt="DV Asistente IA">

        </div>


        <div class="info-asistente">

            <h1>
                DV Asistente IA
            </h1>


            <span>
                ● En línea
            </span>


        </div>


    </header>




    <!-- AREA DE MENSAJES -->


    <main class="chat-area" id="chatArea">


        <div class="mensaje bot">


            <div class="mensaje-contenido">


                Hola 👋

                <br><br>

                Soy <strong>DV Asistente IA</strong>,
                el asistente virtual de DV Computadoras.

                <br><br>

                Estoy disponible para ayudarte a identificar
                problemas de tu computadora o laptop.

                <br><br>

                Cuéntame:

                <br>

                ¿Qué problema presenta tu equipo?


            </div>


            <small>
                Ahora
            </small>


        </div>


    </main>





    <!-- AREA DE ESCRITURA -->


    <footer class="chat-input">


        <input 
        type="text"
        id="mensajeUsuario"
        placeholder="Escribe tu consulta...">


        <button id="btnEnviar">

            Enviar

        </button>


    </footer>



</div>





<!-- Javascript del asistente -->


<script src="../js/dv-asistente.js"></script>


</body>

</html>
